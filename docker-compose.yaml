services:
  magazine-app-postgres-db:
    image: postgres:18.1-bookworm
    container_name: magazine-app-postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - ${PROJECT_ROOT}/backend/out/pgdata:/var/lib/postgresql
    restart: always

  magazine-app-migrations:
      image: migrate/migrate:v4.19.1
      volumes:
        - ${PROJECT_ROOT}/backend/migrations:/migrations

  magazine-app-port-forwarder:
      image: alpine/socat:1.8.0.3
      container_name: magazine-app-port-forwarder
      command: tcp-listen:5432,fork,reuseaddr tcp-connect:magazine-app-postgres-db:5432
      ports:
        - "127.0.0.1:5432:5432"